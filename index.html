<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'" />
    <title>NXT Studio</title>
  </head>
  <body>
    <div id="app">
      <header class="titlebar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32"><rect x="3" y="3" width="26" height="26" rx="7" fill="url(#bm)"/><rect x="9" y="8" width="14" height="9" rx="2" fill="#0d1117" opacity=".8"/><circle cx="16" cy="23" r="3" fill="#ffb020"/><defs><linearGradient id="bm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3d8bfd"/><stop offset="1" stop-color="#12b5c9"/></linearGradient></defs></svg>
          </span>
          <span class="brand-name">NXT Studio</span>
        </div>
        <nav class="tabs" role="tablist">
          <button class="tab" role="tab" data-view="program">
            <svg viewBox="0 0 24 24"><path d="M4 6h7v4H4zM4 14h11v4H4zM13 6h7v4h-7z"/></svg>Program
          </button>
          <button class="tab" role="tab" data-view="drive">
            <svg viewBox="0 0 24 24"><path d="M7 9h10a4 4 0 0 1 3.9 4.9l-.9 3.6a2 2 0 0 1-3.4.9L14 16h-4l-2.6 2.4a2 2 0 0 1-3.4-.9l-.9-3.6A4 4 0 0 1 7 9z"/><path d="M8 12v2M7 13h2M16 12.5h.01M17.5 14h.01"/></svg>Drive
          </button>
          <button class="tab" role="tab" data-view="brick">
            <svg viewBox="0 0 24 24"><rect x="6" y="3" width="12" height="18" rx="2.5"/><rect x="8.5" y="6" width="7" height="5" rx="1"/><circle cx="12" cy="16" r="1.6"/></svg>Brick
          </button>
        </nav>
        <div class="status">
          <span class="chip" id="chip-pad"><span class="dot"></span><span class="chip-label">No controller</span></span>
          <button class="chip chip-button" id="chip-brick"><span class="dot"></span><span class="chip-label">Not connected</span></button>
        </div>
      </header>
      <main>
        <section class="view" id="view-program"></section>
        <section class="view" id="view-drive"></section>
        <section class="view" id="view-brick"></section>
      </main>
      <div class="toast" id="toast" role="status"></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
